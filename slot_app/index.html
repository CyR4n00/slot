<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オリジナル スマスロアプリ (GE風)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container" class="slot-machine">
        <div class="machine-top-led"></div>

        <!-- 液晶ディスプレイ（演出表示エリア） -->
        <div id="display-bezel">
            <div id="media-area">
                <video id="bg-video" autoplay loop muted playsinline>
                    <!-- ソースはJSから動的に設定されます -->
                </video>
                <div id="cutin-layer" class="hidden">
                    <img id="cutin-image" src="" alt="Cutin">
                </div>

                <!-- 液晶内情報表示 -->
                <div id="info-overlay">
                    <div id="state-display" class="neon-text-green">通常</div>
                    <div id="games-display" class="neon-text-yellow">G: 0</div>
                </div>
            </div>
        </div>

        <!-- デジタルセグメント・ランプエリア (スマスロ特有の表示群) -->
        <div class="segment-panel">
            <div class="segment-box">
                <span class="segment-label">CREDIT</span>
                <span id="credit-display" class="segment-number">50</span>
            </div>
            <div class="segment-box">
                <span class="segment-label">PAY</span>
                <span id="pay-display" class="segment-number">0</span>
            </div>
            <div class="segment-box diff-box">
                <span class="segment-label">差枚数</span>
                <span id="diff-display" class="segment-number">0</span>
            </div>
            <div class="lamp-box">
                <div id="lamp-at" class="lamp">BURST</div>
                <div id="lamp-complete" class="lamp">CMPLT</div>
            </div>
        </div>

        <!-- スロットリール・操作エリア -->
        <div id="slot-area">
            <!-- リール -->
            <div class="reels-container">
                <div class="reel" id="reel-left">
                    <div class="reel-symbol" id="symbol-left-top"></div>
                    <div class="reel-symbol" id="symbol-left-mid"></div>
                    <div class="reel-symbol" id="symbol-left-bot"></div>
                </div>
                <div class="reel" id="reel-center">
                    <div class="reel-symbol" id="symbol-center-top"></div>
                    <div class="reel-symbol" id="symbol-center-mid"></div>
                    <div class="reel-symbol" id="symbol-center-bot"></div>
                </div>
                <div class="reel" id="reel-right">
                    <div class="reel-symbol" id="symbol-right-top"></div>
                    <div class="reel-symbol" id="symbol-right-mid"></div>
                    <div class="reel-symbol" id="symbol-right-bot"></div>
                </div>
            </div>

            <!-- 操作ボタン -->
            <div class="controls-container">
                <div class="control-group-left">
                    <button id="btn-maxbet" class="btn-action btn-bet">MAX BET</button>
                    <button id="btn-lever" class="btn-action btn-lever" disabled>LEVER</button>
                </div>
                <div class="control-group-center">
                    <div class="stop-buttons">
                        <button id="btn-stop-left" class="btn-action btn-stop" disabled>STOP</button>
                        <button id="btn-stop-center" class="btn-action btn-stop" disabled>STOP</button>
                        <button id="btn-stop-right" class="btn-action btn-stop" disabled>STOP</button>
                    </div>
                </div>
                <div class="control-group-right">
                    <button id="btn-push" class="btn-action btn-push">PUSH</button>
                </div>
            </div>
        </div>

        <div class="machine-bottom"></div>

        <!-- デバッグ・設定変更用コントロール (本番時は非表示推奨) -->
        <div class="debug-controls">
            <div class="admin-panel">
                <label>設定変更:
                    <select id="setting-select">
                        <option value="1">設定1</option>
                        <option value="2">設定2</option>
                        <option value="3">設定3</option>
                        <option value="4">設定4</option>
                        <option value="5">設定5</option>
                        <option value="6">設定6</option>
                    </select>
                </label>
                <div id="setting-display">現在の設定: 1</div>
            </div>
            <div id="message-log"></div>
        </div>
    </div>

    <!-- スクリプトの読み込み -->
    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
