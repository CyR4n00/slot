<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オリジナル スマスロアプリ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- 背景・演出表示エリア (動画/画像がここに表示されます) -->
        <div id="media-area">
            <video id="bg-video" autoplay loop muted playsinline>
                <!-- ソースはJSから動的に設定されます -->
            </video>
            <div id="cutin-layer" class="hidden">
                <img id="cutin-image" src="" alt="Cutin">
            </div>

            <!-- 情報表示エリア (現在の状態、ATゲーム数など) -->
            <div id="info-overlay">
                <div id="state-display">通常</div>
                <div id="games-display">G: 0</div>
                <div id="credit-display">Credit: 50</div>
                <div id="setting-display">設定: 1</div>
            </div>
        </div>

        <!-- スロットリール・操作エリア -->
        <div id="slot-area">
            <!-- リール -->
            <div class="reels-container">
                <div class="reel" id="reel-left">
                    <div class="reel-symbol" id="symbol-left-top"></div>
                    <div class="reel-symbol" id="symbol-left-mid"></div>
                    <div class="reel-symbol" id="symbol-left-bot"></div>
                </div>
                <div class="reel" id="reel-center">
                    <div class="reel-symbol" id="symbol-center-top"></div>
                    <div class="reel-symbol" id="symbol-center-mid"></div>
                    <div class="reel-symbol" id="symbol-center-bot"></div>
                </div>
                <div class="reel" id="reel-right">
                    <div class="reel-symbol" id="symbol-right-top"></div>
                    <div class="reel-symbol" id="symbol-right-mid"></div>
                    <div class="reel-symbol" id="symbol-right-bot"></div>
                </div>
            </div>

            <!-- 操作ボタン -->
            <div class="controls-container">
                <button id="btn-lever" class="btn-action">レバーON<br>(Space)</button>
                <div class="stop-buttons">
                    <button id="btn-stop-left" class="btn-action btn-stop" disabled>左<br>(Z)</button>
                    <button id="btn-stop-center" class="btn-action btn-stop" disabled>中<br>(X)</button>
                    <button id="btn-stop-right" class="btn-action btn-stop" disabled>右<br>(C)</button>
                </div>
            </div>

            <!-- デバッグ・設定変更用コントロール (本番時は非表示推奨) -->
            <div class="debug-controls">
                <label>設定変更:
                    <select id="setting-select">
                        <option value="1">設定1</option>
                        <option value="2">設定2</option>
                        <option value="3">設定3</option>
                        <option value="4">設定4</option>
                        <option value="5">設定5</option>
                        <option value="6">設定6</option>
                    </select>
                </label>
                <div id="message-log"></div>
            </div>
        </div>
    </div>

    <!-- スクリプトの読み込み -->
    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
